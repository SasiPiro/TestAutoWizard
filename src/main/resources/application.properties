# Server Configuration
server.port=8080

# Database: PostgreSQL. No default on purpose: set SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD (the dev profile points to the
# database of compose.yaml; tests use a Testcontainers database).
# The schema is created by the Flyway migrations in db/migration. Hibernate only validates
# it: a mismatch between entities and tables fails at startup.

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# No database connection held for the whole HTTP request and no lazy loading from
# controllers: what a request reads is decided by the service and its queries
spring.jpa.open-in-view=false
# Safety net for lazy associations that are not fetched explicitly
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration
# Credentials only from the environment, never in this file
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Reminder emails (ReminderMailer): off unless MAIL_ENABLED=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# CORS: comma-separated list of browser origins allowed to call the API,
# e.g. https://app.example.com. Empty = no cross-origin browser access.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Zone of the users: local dates such as a task's scheduled date are in this zone
app.time-zone=Europe/Rome

# Scheduled jobs (NightlyMaintenanceJob). app.scheduling.enabled=false stops the triggers.
app.jobs.nightly.cron=0 1 0 * * *
# Minimum time the job's lock is held: another instance's trigger in this window is skipped
app.jobs.nightly.lock-at-least-for=PT5M
# Pending tasks due within this many days get a reminder
app.reminders.upcoming-days=7

# Error messages (e.g. validation) in one language, not the server's or the caller's locale:
# clients read the field names and the problem type, the text is for developers
spring.web.locale=en
spring.web.locale-resolver=fixed

# Logging
# Request id (RequestIdFilter) in every line: "[-]" for lines outside an HTTP request
logging.pattern.correlation=[%X{requestId:--}]\u0020
logging.level.com.autowizard=INFO

# JWT Configuration
# No default on purpose: the application refuses to start without a strong secret.
# Production: set the JWT_SECRET environment variable.
# Local development: run with the 'dev' profile (application-dev.properties).
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000 