# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:h2:mem:autowizarddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration
# Credentials only from the environment, never in this file
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
# No default on purpose: the application refuses to start without a strong secret.
# Production: set the JWT_SECRET environment variable.
# Local development: run with the 'dev' profile (application-dev.properties).
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000 