# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:h2:mem:autowizarddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# The H2 console is a database shell in the browser: enabled only by the dev profile
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# No database connection held for the whole HTTP request and no lazy loading from
# controllers: what a request reads is decided by the service and its queries
spring.jpa.open-in-view=false
# Safety net for lazy associations that are not fetched explicitly
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration
# Credentials only from the environment, never in this file
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS: comma-separated list of browser origins allowed to call the API,
# e.g. https://app.example.com. Empty = no cross-origin browser access.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Zone of the users: local dates such as a task's scheduled date are in this zone
app.time-zone=Europe/Rome

# Scheduled jobs (NightlyMaintenanceJob). app.scheduling.enabled=false stops the triggers.
app.jobs.nightly.cron=0 1 0 * * *

# Error messages (e.g. validation) in one language, not the server's or the caller's locale:
# clients read the field names and the problem type, the text is for developers
spring.web.locale=en
spring.web.locale-resolver=fixed

# Logging
# Request id (RequestIdFilter) in every line: "[-]" for lines outside an HTTP request
logging.pattern.correlation=[%X{requestId:--}]\u0020
logging.level.com.autowizard=INFO

# JWT Configuration
# No default on purpose: the application refuses to start without a strong secret.
# Production: set the JWT_SECRET environment variable.
# Local development: run with the 'dev' profile (application-dev.properties).
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000 