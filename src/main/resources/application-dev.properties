# Local development only. Activate with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# or SPRING_PROFILES_ACTIVE=dev. Never use this profile in production:
# everything in this file is public in the repository.

jwt.secret=dev-only-sX5k8bYXONpegAqCIPMJZFsyLDrPzk4l9vV1MA_sJWva6AZL0NhkBg

# The PostgreSQL of compose.yaml (docker compose up -d), on POSTGRES_PORT (default 5432).
# Tests and spring-boot:test-run use a Testcontainers database instead.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/autowizard
spring.datasource.username=autowizard
spring.datasource.password=autowizard

# The object store of compose.yaml (SeaweedFS), on STORAGE_PORT (default 8333)
app.storage.endpoint=http://localhost:${STORAGE_PORT:8333}
app.storage.bucket=autowizard-documents
app.storage.access-key=autowizard
app.storage.secret-key=autowizard-secret
app.storage.path-style=true

logging.level.com.autowizard=DEBUG

# Local frontends: web dev servers and the Expo web preview
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081
